name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-packages:
    name: ${{ matrix.package }} (analyze + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/core
          - packages/fishscore
          - packages/weather
          - packages/weather_openmeteo
          - packages/scoring_pipeline
          - example
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # Aucun test ne sort sur le réseau : les fournisseurs distants sont
      # rejoués depuis des fixtures figées.
      - name: Run tests
        run: dart test

  generated-code:
    name: Species catalog is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get
        working-directory: packages/fishscore

      # knowledge/species/*.json is the single source of truth: fail if the
      # generated catalog was not regenerated after editing a sheet.
      - name: Check generated species catalog
        run: dart run tool/generate_species_catalog.dart --check
        working-directory: packages/fishscore
