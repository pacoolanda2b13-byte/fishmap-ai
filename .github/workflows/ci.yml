name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-packages:
    name: ${{ matrix.package }} (analyze + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/core
          - packages/fishscore
          - packages/weather
          - packages/weather_openmeteo
          - packages/scoring_pipeline
          - packages/edge_bridge
          - example
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # Aucun test ne sort sur le réseau : les fournisseurs distants sont
      # rejoués depuis des fixtures figées.
      - name: Run tests
        run: dart test

  generated-code:
    name: Species catalog is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get
        working-directory: packages/fishscore

      # knowledge/species/*.json is the single source of truth: fail if the
      # generated catalog was not regenerated after editing a sheet.
      - name: Check generated species catalog
        run: dart run tool/generate_species_catalog.dart --check
        working-directory: packages/fishscore

  edge-functions:
    name: Supabase Edge Functions (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # bridge.js is a build artifact kept out of version control; the Edge
      # Function cannot run without it.
      - name: Build Dart bridge
        run: ./tool/build_edge_bridge.sh

      - name: Check formatting
        run: deno fmt --check
        working-directory: supabase/functions

      - name: Lint
        run: deno lint
        working-directory: supabase/functions

      # Tests drive the real compiled bridge over frozen fixtures: no network
      # and no database are required.
      - name: Run tests
        run: deno test --allow-read --allow-env evaluate/handler_test.ts
        working-directory: supabase/functions
