name: core
description: >-
  Briques communes de FishMap AI : Result, Failure, Logger, Config, value
  objects (Coordinates, Distance), conversions d'unités, TimeProvider et
  exceptions. Aucune dépendance métier ni Flutter : tous les packages du projet
  ne dépendent que de core, jamais entre eux.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  meta: ^1.11.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
