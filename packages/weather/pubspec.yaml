name: weather
description: >-
  Couche météo provider-agnostic de FishMap AI. Normalise les données météo et
  marines (WeatherData), les organise en séries temporelles (WeatherForecast) et
  les transforme en entrées FishScore (WeatherMapper) sans dépendre d'un
  fournisseur particulier.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  meta: ^1.11.0
  fishscore:
    path: ../fishscore

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
