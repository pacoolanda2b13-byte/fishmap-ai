name: weather
description: >-
  Couche météo provider-agnostic de FishMap AI. Normalise les données météo et
  marines (WeatherData), les organise en séries temporelles (WeatherForecast)
  et orchestre plusieurs fournisseurs interchangeables (WeatherRepository)
  avec repli automatique. Ne dépend que de core.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  meta: ^1.11.0
  core:
    path: ../core

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
